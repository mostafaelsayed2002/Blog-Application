name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once — the second would race the first on the
# server. Queue them instead of cancelling, so no commit gets skipped.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run tests
        working-directory: backend
        run: npm test

  build-and-push:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time, so the
      # production domain has to be known HERE, not at `docker run` time.
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into the server and roll the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/blog
            # nginx config + this compose file are read from the repo, so the
            # server needs the latest commit as well as the latest images.
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # A 50GB disk fills up fast with orphaned image layers.
            docker image prune -f
