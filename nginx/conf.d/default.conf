# ---------------------------------------------------------------------------
# HTTP :80
# Two jobs: serve the ACME challenge (so certbot can prove we own the domain
# on renewals), and push everything else to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name elsayed2002.tech www.elsayed2002.tech;

    # Let's Encrypt writes its challenge files here; this must stay on plain
    # HTTP, so it is matched before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name elsayed2002.tech www.elsayed2002.tech;

    ssl_certificate     /etc/letsencrypt/live/elsayed2002.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elsayed2002.tech/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    client_max_body_size 10M;

    # ---- API -> Express backend --------------------------------------------
    # NOTE: no trailing slash on proxy_pass, so the "/api" prefix is preserved.
    # The backend mounts its routes at /api (see backend/src/app.ts), so a
    # request for /api/posts must arrive at the backend still spelled /api/posts.
    location /api/ {
        proxy_pass       http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- everything else -> Next.js ----------------------------------------
    location / {
        proxy_pass       http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
